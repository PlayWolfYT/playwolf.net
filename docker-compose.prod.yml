# Production stack: web image from CI (`:latest` on releases from `production`).
# Usage: docker compose -f docker-compose.prod.yml up -d

include:
  - docker-compose.services.yml

services:
  web:
    image: ghcr.io/playwolfyt/playwolf.net:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-playwolf}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-playwolf}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
