# Lint, test, typecheck, and Docker build on every PR.
# On push to `production` or `development`, also push images to ghcr.io.
#
# Self-hosted runner: Git + Docker Engine (Buildx). Runner user must be able to
# run `docker`. Bun comes from oven-sh/setup-bun.
#
# Required for pushes: default GITHUB_TOKEN with packages:write (enabled below).
# Image: ghcr.io/<owner>/<repo lowercase>:<branch> and :sha-<short>

name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Note: avoid Buildx `cache-to: type=gha` on self-hosted — it hits GitHub’s cache
  # API; outages return HTML and break the build with JSON parse errors.

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

  test:
    name: Test & typecheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  docker:
    name: Docker
    runs-on: self-hosted
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${lower}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on branch push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
