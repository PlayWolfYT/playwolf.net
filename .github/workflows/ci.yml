# - Push / PR → lint + test + build (catches broken code/builds before release).
# - Published GitHub Release → build + push Docker image to ghcr.io.
#
# Images are tagged:
#   :<release tag>     e.g. v0.1.0 or v0.0.1-dev
#   :sha-<full commit>
#   :latest            only when the release target branch is `production`
#   :latest-dev        only when the release target branch is `main` (staging)
#
# Create a Release from the GitHub UI (targeting `main` or `production`),
# publish it, then pull e.g. docker pull ghcr.io/owner/playwolf.net:v0.0.1-dev
#
# Self-hosted runner: Git + Docker (Buildx). Bun via oven-sh/setup-bun.

name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

  test:
    name: Test & typecheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: self-hosted
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Next.js build
        run: bun run build

  docker:
    name: Docker (release only)
    runs-on: self-hosted
    needs: [lint, test, build]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${lower}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (version, sha, latest / latest-dev)
        id: tags
        env:
          IMG: ${{ steps.image.outputs.name }}
          REL: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMG}:${REL}"
            echo "${IMG}:sha-${SHA}"
            if [ "$TARGET" = "production" ]; then
              echo "${IMG}:latest"
            fi
            if [ "$TARGET" = "main" ]; then
              echo "${IMG}:latest-dev"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
